name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Executar testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Rodar testes
        run: python -m unittest discover -v